name: Checks
on:
    pull_request:
    push:
        branches:
            - "master"
            - "v[0-9]"
    workflow_dispatch:
jobs:
    checks:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php-version: ['8.1', '8.2', '8.3', '8.4', '8.5']
        steps:
            -
                name: Checkout code
                uses: actions/checkout@v6
            -
                name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php-version }}
            -
                name: Install dependencies
                run: composer install --no-progress --prefer-dist --no-interaction

            -
                name: Run checks
                run: composer check

    tests-windows:
        runs-on: windows-latest
        strategy:
            fail-fast: false
            matrix:
                php-version: ['8.1', '8.2', '8.3', '8.4', '8.5']
        steps:
            -
                name: Checkout code
                uses: actions/checkout@v6
            -
                name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php-version }}
            -
                name: Install dependencies
                run: composer install --no-progress --prefer-dist --no-interaction

            -
                name: Run tests
                run: composer check:tests
